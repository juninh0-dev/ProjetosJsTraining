<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To-Do de Tarefas</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>My To-Do</h1>
            <p>Organize suas tarefas e seja mais produtivo!</p>
            <form action="" onsubmit="addDo(event)">
                <div class="inputAdd">
                    <input placeholder="Digite uma nova tarefa..." id="toTask" type="text">
                    <button>Adicionar</button>
                </div>
                <div class="btnsLayout">
                    <button>Tarefas</button>
                    <button>Pendentes</button>
                    <button>Concluídas</button>
                    <div class="line">
                        <p id="pendingTasks">0 tarefas pendentes </p>
                    </div>
                </div>
                <div class="tasks" id="resp">
                </div>
            </form>
        </div>
    </div>

    </div>
    <script>
        // função para criar uma nova tarefa
        function addDo(event) {

            event.preventDefault();
            var task = document.getElementById("toTask").value;
            var taskCreatead = document.getElementById("resp");

            if (!task == null || !task == "") {
                taskCreatead.innerHTML += `
                <div class="sectionTask">
                    <div class="tarefas" id="task">
                        <input class="checkOut" id='checkOut' onclick="check(this)" type="checkbox">
                        </input>
                        <p> ${task} </p>
                        </div>
                        <button class="limpar" onclick='limpar(this)'> 
                            Limpar 
                            </button>
                </div>`

            } else {
                window.alert("Digite algo para fazer.");
            }
        }

        // função para remover a tarefa
        function limpar(button) {
            button.parentElement.remove();
        }
        // função para dar check na tarefa
        function check(input) {
            var divTask = input.parentElement;
            var texto = divTask.querySelector("p");

            if (input.checked) {
                texto.style.textDecoration = "line-through";
                texto.style.color = "gray";
            } else {
                texto.style.textDecoration = "none";
                texto.style.color = "black";
            }

        }
    </script>
</body>

</html>
